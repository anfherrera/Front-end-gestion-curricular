name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Un push nuevo a la misma rama cancela la ejecución anterior
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  calidad:
    name: Lint, build y pruebas
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Instalar dependencias
        run: npm ci
        env:
          # Cypress no se usa aquí; evita descargar su binario
          CYPRESS_INSTALL_BINARY: 0

      - name: Lint
        run: npm run lint

      - name: Build
        run: npx ng build

      - name: Pruebas unitarias
        run: npx ng test --watch=false --browsers=ChromeHeadlessCI
