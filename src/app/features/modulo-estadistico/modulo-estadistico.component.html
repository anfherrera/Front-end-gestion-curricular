<div class="modulo-estadistico-container">
  <mat-tab-group class="main-tabs" animationDuration="300ms">
    <mat-tab label="Resumen general">
      <div class="tab-content">
        <app-dashboard-estadistico></app-dashboard-estadistico>
      </div>
    </mat-tab>
    <mat-tab label="Cursos de Verano">
      <!-- matTabContent: se crea al abrir la pestaña. Si se crea oculta, sus gráficos no encuentran el <canvas>. -->
      <ng-template matTabContent>
        <div class="tab-content">
          <app-cursos-verano-dashboard></app-cursos-verano-dashboard>
        </div>
      </ng-template>
    </mat-tab>
  </mat-tab-group>
</div>
