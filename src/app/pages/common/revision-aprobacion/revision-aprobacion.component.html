<div class="revision-container">

  <app-solicitudes-bandeja
    #bandeja
    [pendientes]="pendientes"
    [procesadas]="procesadas"
    (solicitudSeleccionada)="onSolicitudSeleccionada($event)"
    (periodoChange)="onPeriodoChange($event)">
  </app-solicitudes-bandeja>

  <!-- Documentación de la solicitud seleccionada -->
  <app-card-container
    *ngIf="seleccionada"
    title="Documentación Adjunta"
    icon="description">

    <app-documentation-viewer
      [documentos]="documentos"
      [solicitudId]="seleccionada.id_solicitud"
      [proceso]="config.proceso"
      [servicio]="config.servicio"
      [puedeAgregarComentarios]="true"
      (comentarioAgregado)="onComentarioAgregado($event)">
    </app-documentation-viewer>

  </app-card-container>

  <!-- Botones de acción para la solicitud -->
  <div class="botones-acciones" *ngIf="seleccionada">
    <button mat-raised-button color="primary" [disabled]="!puedeDecidir" (click)="aprobar()">
      {{ textoAprobar }}
    </button>
    <button mat-raised-button color="warn" [disabled]="!puedeDecidir" (click)="rechazar()">
      Rechazar {{ config.nombreProceso }}
    </button>
  </div>

</div>
