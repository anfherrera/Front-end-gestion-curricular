<mat-card class="card-container card-animated animate-fade-in-up">
  <mat-card-header>
    @if (icon) {
      <mat-icon class="icon-bounce">{{ icon }}</mat-icon>
    }
    <mat-card-title>{{ title }}</mat-card-title>
    @if (subtitle) {
      <mat-card-subtitle>{{ subtitle }}</mat-card-subtitle>
    }
  </mat-card-header>

  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
