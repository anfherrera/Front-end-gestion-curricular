<mat-card class="card-container card-animated animate-fade-in-up">
  <mat-card-header>
    @if (icon(); as icono) {
      <mat-icon class="icon-bounce">{{ icono }}</mat-icon>
    }
    <mat-card-title>{{ title() }}</mat-card-title>
    @if (subtitle(); as subtitulo) {
      <mat-card-subtitle>{{ subtitulo }}</mat-card-subtitle>
    }
  </mat-card-header>

  <mat-card-content>
    <ng-content></ng-content>
  </mat-card-content>
</mat-card>
