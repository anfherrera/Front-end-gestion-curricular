<app-card-container
  [title]="title"
  [icon]="icon">

  @if (allowToggle) {
    <div class="approved-section-controls">
      <button
        mat-stroked-button
        color="primary"
        (click)="toggleSection()">
        <mat-icon>{{ showContent ? 'expand_less' : 'expand_more' }}</mat-icon>
        {{ showContent ? 'Ocultar listado' : 'Mostrar listado' }}
      </button>
    </div>
  }

  @if (loading) {
    <mat-progress-bar
      mode="indeterminate">
    </mat-progress-bar>
  }

  @if (showContent) {
    <div>
      @if (hasSolicitudes) {
        <app-request-status-table
          [solicitudes]="solicitudes"
          [showOficio]="false"
          [showComentarios]="false"
          [showSeleccionar]="false">
        </app-request-status-table>
      } @else {
        <div class="approved-empty-state">
          <mat-icon>inbox</mat-icon>
          <p>{{ emptyMessage }}</p>
        </div>
      }
    </div>
  }


</app-card-container>
